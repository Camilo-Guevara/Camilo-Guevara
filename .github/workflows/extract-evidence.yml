name: Extraer evidencias autorizadas
on:
  push:
    branches:
      - docs/frugi-cyberlab-2026-10-16
    paths:
      - .github/workflows/extract-evidence.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/frugi-cyberlab-2026-10-16
          persist-credentials: true
      - name: Extraer las cuatro evidencias del ZIP validado
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("Evidencias_Frugi_CyberLab_GitHub.zip")
          expected = {
              "proyectos/frugi-app/evidencias/frugi-prototipo-01.png",
              "proyectos/frugi-app/evidencias/frugi-prototipo-02.png",
              "proyectos/cyberlab/evidencias/cyberlab-apache-http-historico.png",
              "proyectos/cyberlab/evidencias/cyberlab-ssh-historico.jpeg",
              "proyectos/frugi-app/evidencias/IMAGENES.md",
              "proyectos/cyberlab/evidencias/IMAGENES.md",
              "INSTRUCCIONES.md",
          }
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist()) == expected, "Unexpected ZIP entries"
              for name in sorted(expected - {"INSTRUCCIONES.md"}):
                  data = z.read(name)
                  assert len(data) < 3_000_000
                  p = Path(name)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(data)
          PY
      - name: Guardar fotografías y sus notas en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proyectos/frugi-app/evidencias proyectos/cyberlab/evidencias
          if ! git diff --cached --quiet; then
            git commit -m "docs: extraer cuatro fotografías originales del ZIP"
            git push origin HEAD:docs/frugi-cyberlab-2026-10-16
          fi
